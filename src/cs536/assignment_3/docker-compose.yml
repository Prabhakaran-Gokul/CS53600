version: '3.8'

services:
  dev:
    build:
      context: ../../..
      dockerfile: src/cs536/assignment_3/Dockerfile
    privileged: true
    network_mode: host
    volumes:
      - ../../..:/workspace
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
